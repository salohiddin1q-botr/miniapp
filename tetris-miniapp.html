<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tetris Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #111827;
    --fg: #f5f5f5;
    --panel: #1f2937;
    --accent: #0088cc;
    box-sizing: border-box;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    overflow: hidden;
    touch-action: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  h1 {
    font-size: 1.1rem;
    margin: 10px 0 4px;
  }
  #hud {
    display: flex;
    gap: 18px;
    font-size: 0.85rem;
    color: #aaa;
    margin-bottom: 8px;
  }
  #hud b { color: var(--fg); }
  #board-wrap {
    background: var(--panel);
    padding: 6px;
    border-radius: 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  canvas {
    display: block;
    background: #000;
    border-radius: 4px;
  }
  #controls {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    width: 100%;
    max-width: 320px;
    margin-top: 14px;
    padding: 0 12px;
  }
  #controls button {
    padding: 14px 0;
    font-size: 1.2rem;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
  }
  #controls button:active { opacity: 0.8; }
  #rotateBtn { grid-column: span 2; }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    text-align: center;
    padding: 20px;
  }
  #overlay.show { display: flex; }
  #overlay button {
    padding: 10px 22px;
    font-size: 1rem;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
  }
</style>
</head>
<body>
  <h1>Tetris</h1>
  <div id="hud">
    <span>Ball: <b id="score">0</b></span>
    <span>Daraja: <b id="level">1</b></span>
    <span>Qator: <b id="lines">0</b></span>
  </div>
  <div id="board-wrap">
    <canvas id="board" width="240" height="480"></canvas>
  </div>
  <div id="controls">
    <button id="leftBtn">◀</button>
    <button id="downBtn">▼</button>
    <button id="rightBtn">▶</button>
    <button id="rotateBtn">⟳ Aylantirish</button>
  </div>

  <div id="overlay">
    <h2 id="overlayTitle">O'yin tugadi</h2>
    <p id="overlayScore"></p>
    <button id="restartBtn">Qayta boshlash</button>
    <button id="sendBtn">Natijani botga yuborish</button>
  </div>

<script>
(function () {
  var tg = null;
  try {
    if (window.Telegram && window.Telegram.WebApp) {
      tg = window.Telegram.WebApp;
      tg.expand();
      tg.ready();
    }
  } catch (e) { tg = null; }

  var COLS = 10, ROWS = 20, CELL = 24;
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');

  var COLORS = {
    I: '#22d3ee', J: '#3b82f6', L: '#f97316',
    O: '#eab308', S: '#22c55e', T: '#a855f7', Z: '#ef4444'
  };

  var SHAPES = {
    I: [[0,1],[1,1],[2,1],[3,1]],
    J: [[0,0],[0,1],[1,1],[2,1]],
    L: [[2,0],[0,1],[1,1],[2,1]],
    O: [[1,0],[2,0],[1,1],[2,1]],
    S: [[1,0],[2,0],[0,1],[1,1]],
    T: [[1,0],[0,1],[1,1],[2,1]],
    Z: [[0,0],[1,0],[1,1],[2,1]]
  };

  var grid, current, score, level, lines, dropInterval, dropTimer, gameOver, paused;

  function emptyGrid() {
    var g = [];
    for (var r = 0; r < ROWS; r++) g.push(new Array(COLS).fill(null));
    return g;
  }

  function randType() {
    var keys = Object.keys(SHAPES);
    return keys[Math.floor(Math.random() * keys.length)];
  }

  function newPiece() {
    var type = randType();
    var cells = SHAPES[type].map(function (c) { return [c[0], c[1]]; });
    return { type: type, cells: cells, x: 3, y: 0 };
  }

  function collides(cells, offX, offY) {
    for (var i = 0; i < cells.length; i++) {
      var x = cells[i][0] + offX;
      var y = cells[i][1] + offY;
      if (x < 0 || x >= COLS || y >= ROWS) return true;
      if (y >= 0 && grid[y][x]) return true;
    }
    return false;
  }

  function rotateCells(cells) {
    // rotate around approximate center (1,1) then re-normalize
    var rotated = cells.map(function (c) {
      var x = c[0], y = c[1];
      return [1 - (y - 1), 1 + (x - 1)];
    });
    return rotated;
  }

  function merge() {
    current.cells.forEach(function (c) {
      var x = current.x + c[0], y = current.y + c[1];
      if (y >= 0) grid[y][x] = current.type;
    });
  }

  function clearLines() {
    var cleared = 0;
    for (var r = ROWS - 1; r >= 0; r--) {
      if (grid[r].every(function (v) { return v; })) {
        grid.splice(r, 1);
        grid.unshift(new Array(COLS).fill(null));
        cleared++;
        r++;
      }
    }
    if (cleared > 0) {
      var points = [0, 100, 300, 500, 800][cleared] * level;
      score += points;
      lines += cleared;
      level = 1 + Math.floor(lines / 10);
      dropInterval = Math.max(120, 800 - (level - 1) * 70);
      updateHud();
    }
  }

  function updateHud() {
    document.getElementById('score').innerText = score;
    document.getElementById('level').innerText = level;
    document.getElementById('lines').innerText = lines;
  }

  function spawn() {
    current = newPiece();
    if (collides(current.cells, current.x, current.y)) {
      endGame();
    }
  }

  function move(dx) {
    if (gameOver || paused) return;
    if (!collides(current.cells, current.x + dx, current.y)) {
      current.x += dx;
      draw();
    }
  }

  function softDrop() {
    if (gameOver || paused) return;
    if (!collides(current.cells, current.x, current.y + 1)) {
      current.y += 1;
      score += 1;
      updateHud();
    } else {
      merge();
      clearLines();
      spawn();
    }
    draw();
  }

  function hardDrop() {
    if (gameOver || paused) return;
    while (!collides(current.cells, current.x, current.y + 1)) {
      current.y += 1;
      score += 2;
    }
    merge();
    clearLines();
    spawn();
    updateHud();
    draw();
  }

  function rotate() {
    if (gameOver || paused) return;
    var rotated = rotateCells(current.cells);
    var kicks = [0, -1, 1, -2, 2];
    for (var i = 0; i < kicks.length; i++) {
      if (!collides(rotated, current.x + kicks[i], current.y)) {
        current.cells = rotated;
        current.x += kicks[i];
        draw();
        return;
      }
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        if (grid[r][c]) drawCell(c, r, COLORS[grid[r][c]]);
      }
    }
    if (current) {
      current.cells.forEach(function (cell) {
        var x = current.x + cell[0], y = current.y + cell[1];
        if (y >= 0) drawCell(x, y, COLORS[current.type]);
      });
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    for (var i = 0; i <= COLS; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, ROWS * CELL); ctx.stroke();
    }
    for (var j = 0; j <= ROWS; j++) {
      ctx.beginPath(); ctx.moveTo(0, j * CELL); ctx.lineTo(COLS * CELL, j * CELL); ctx.stroke();
    }
  }

  function drawCell(x, y, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
  }

  function endGame() {
    gameOver = true;
    clearInterval(dropTimer);
    document.getElementById('overlayTitle').innerText = "O'yin tugadi";
    document.getElementById('overlayScore').innerText = "Natija: " + score + " ball, " + lines + " qator";
    document.getElementById('overlay').classList.add('show');
  }

  function startGame() {
    grid = emptyGrid();
    score = 0; level = 1; lines = 0; gameOver = false; paused = false;
    dropInterval = 800;
    updateHud();
    document.getElementById('overlay').classList.remove('show');
    spawn();
    draw();
    clearInterval(dropTimer);
    dropTimer = setInterval(function () {
      if (!gameOver && !paused) softDrop();
    }, dropInterval);
    scheduleRedrop();
  }

  function scheduleRedrop() {
    // restart interval whenever speed changes
    clearInterval(dropTimer);
    dropTimer = setInterval(function () {
      if (!gameOver && !paused) softDrop();
    }, dropInterval);
  }

  var lastLevel = 1;
  setInterval(function () {
    if (level !== lastLevel) {
      lastLevel = level;
      scheduleRedrop();
    }
  }, 300);

  // Controls
  document.getElementById('leftBtn').addEventListener('click', function () { move(-1); });
  document.getElementById('rightBtn').addEventListener('click', function () { move(1); });
  document.getElementById('downBtn').addEventListener('click', function () { softDrop(); draw(); });
  document.getElementById('rotateBtn').addEventListener('click', rotate);
  document.getElementById('restartBtn').addEventListener('click', startGame);

  document.getElementById('sendBtn').addEventListener('click', function () {
    try {
      if (tg) {
        tg.sendData(JSON.stringify({ score: score, lines: lines, level: level }));
        tg.close();
      }
    } catch (e) {}
  });

  // Keyboard (for desktop testing)
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') move(-1);
    else if (e.key === 'ArrowRight') move(1);
    else if (e.key === 'ArrowDown') { softDrop(); draw(); }
    else if (e.key === 'ArrowUp') rotate();
    else if (e.key === ' ') { hardDrop(); }
  });

  // Swipe controls on canvas
  var touchStartX = 0, touchStartY = 0, touchMoved = false;
  canvas.addEventListener('touchstart', function (e) {
    var t = e.touches[0];
    touchStartX = t.clientX; touchStartY = t.clientY; touchMoved = false;
  });
  canvas.addEventListener('touchmove', function (e) {
    e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchend', function (e) {
    var t = e.changedTouches[0];
    var dx = t.clientX - touchStartX;
    var dy = t.clientY - touchStartY;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) {
      rotate();
    } else if (Math.abs(dx) > Math.abs(dy)) {
      move(dx > 0 ? 1 : -1);
    } else if (dy > 0) {
      hardDrop();
    }
  });

  startGame();
})();
</script>
</body>
</html>
